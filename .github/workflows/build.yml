name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ZIP=$(ls *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            mkdir -p _src && unzip -q -o "$ZIP" -d _src
            SETTINGS=$(find _src -name settings.gradle.kts | head -n 1)
          else
            SETTINGS=$(find . -name settings.gradle.kts | head -n 1)
          fi
          [ -n "$SETTINGS" ] || { echo "ما لقيت settings.gradle.kts"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Add google-services.json
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json "$PROJECT_DIR/app/google-services.json"
          elif [ ! -f "$PROJECT_DIR/app/google-services.json" ]; then
            echo "ما لقيت google-services.json. ارفعو في أول الريبو."; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk NileLostFound.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NileLostFound-apk
          path: NileLostFound.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: مفقودات جامعة النيل v${{ github.run_number }}
          files: NileLostFound.apk
